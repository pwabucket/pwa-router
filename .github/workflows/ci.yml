name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm build
            - run: pnpm typecheck:rr8

            # Back-gesture flows on React Router 7 and 8
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
